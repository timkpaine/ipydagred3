[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "ipydagred3"
authors = [
    {name = "Tim Paine", email = "t.paine154@gmail.com"},
]
description = "An AnyWidget graph widget powered by spaday-dagre"
readme = "README.md"
license = { file = "LICENSE" }
version = "0.4.1"
requires-python = ">=3.11"
keywords = ["Jupyter", "JupyterLab", "Widgets", "IPython", "Graph", "DAG"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "spaday[widget]>=0.13,<1.0",
    "spaday-dagre>=0.3,<1.0",
]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatchling",
    "jupyterlab>=4.6.4,<5",
    "mdformat",
    "mdformat-frontmatter",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

test = ["pytest", "pytest-cov"]

[project.scripts]

[project.urls]
Repository = "https://github.com/timkpaine/ipydagred3"
Homepage = "https://github.com/timkpaine/ipydagred3"

[tool.bumpversion]
current_version = "0.4.1"
commit = true
tag = false
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "ipydagred3/_version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "binder/requirements.txt"
search = 'ipydagred3=={current_version}'
replace = 'ipydagred3=={new_version}'

[tool.coverage.run]
branch = true
omit = [
    "ipydagred3/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "ipydagred3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ipydagred3",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "ipydagred3/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "ipydagred3",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]
